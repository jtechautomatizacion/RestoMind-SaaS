org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# El SDK instalado en esta máquina es android-36.1, más nuevo que el último
# que esta versión de AGP declara como probado. Compila igual; esto solo
# calla la advertencia para que no tape un problema real en el log.
android.suppressUnsupportedCompileSdk=36
