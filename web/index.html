<!DOCTYPE html>
<html lang="es">
<head>
  <!-- `flutter build web --base-href` reemplaza este valor. La app se sirve en "/". -->
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RestoMind: mesas, cocina, cobro con boleta SUNAT y caja.">
  <meta name="theme-color" content="#0F1317">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RestoMind">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>RestoMind</title>
  <link rel="manifest" href="manifest.json">
  <!-- Sin <style> ni <script> en línea: la CSP de la app no los permite. El
       fondo mientras carga lo pone la propia app. -->
</head>
<body>
  <noscript>RestoMind necesita JavaScript activado en el navegador.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
